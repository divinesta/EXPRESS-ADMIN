name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Prisma ${{ matrix.prisma-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep this list aligned with package.json peerDependencies and CHANGELOG.md.
        prisma-version: ["7.5.0"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: express_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d express_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/express_admin
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install admin UI dependencies
        run: bun install --cwd ui --frozen-lockfile
      - name: Use the Prisma version under test
        run: bun add --no-save --dev prisma@${{ matrix.prisma-version }} @prisma/client@${{ matrix.prisma-version }} @prisma/internals@${{ matrix.prisma-version }} @prisma/adapter-pg@${{ matrix.prisma-version }}
      - name: Generate test Prisma client
        run: bunx prisma generate
      - name: Synchronize test database
        run: bun run db:push
      - name: Type check, build, and test
        run: |
          bun run typecheck
          bun run build
          bun test
      - name: Verify tarball installation and mount
        run: bun run test:pack
