services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: prisma-express-admin-basic-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prisma_express_admin_basic
    ports:
      - "5435:5432"
    volumes:
      - prisma_express_admin_basic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prisma_express_admin_basic"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prisma_express_admin_basic_postgres_data:
