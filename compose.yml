services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: express-admin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: express_admin
    ports:
      - "5435:5432"
    volumes:
      - express_admin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d express_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  express_admin_postgres_data:
  express_admin_pgadmin_data: